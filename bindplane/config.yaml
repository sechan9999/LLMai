# Bindplane Agent / OTel Collector configuration for llmai → Dynatrace.
#
# Receives OTLP from the llmai agent (HTTP/4318 + gRPC/4317), batches,
# adds a deployment.environment attribute, and exports to Dynatrace's
# OTLP /api/v2/otlp/v1/{traces,metrics,logs} endpoint.
#
# Reference: https://docs.dynatrace.com/docs/shortlink/otel-getstarted-otlpexport

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 10s
    send_batch_size: 512

  resourcedetection:
    detectors: [env, system]
    timeout: 2s

  attributes/deploy:
    actions:
      - key: deployment.environment
        value: ${env:DEPLOYMENT_ENV}
        action: upsert

exporters:
  otlphttp/dynatrace:
    endpoint: ${env:DT_ENDPOINT}/api/v2/otlp
    headers:
      Authorization: "Api-Token ${env:DT_API_TOKEN}"

  # llmai's own OTel logs are tee'd to Elastic so the agent can query
  # its own behavior via `query_logs`. Optional — comment out the
  # exporter and the logs pipeline below if you're not running Elastic.
  elasticsearch/agent-logs:
    endpoints:
      - ${env:ES_URL}
    logs_index: llmai-agent-logs
    user: ${env:ES_USER}
    password: ${env:ES_PASSWORD}
    tls:
      insecure_skip_verify: ${env:ES_INSECURE}

  # Uncomment for local debugging:
  # debug:
  #   verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resourcedetection, attributes/deploy]
      exporters: [otlphttp/dynatrace]
    metrics:
      receivers: [otlp]
      processors: [batch, resourcedetection, attributes/deploy]
      exporters: [otlphttp/dynatrace]
    logs:
      receivers: [otlp]
      processors: [batch, resourcedetection, attributes/deploy]
      exporters: [elasticsearch/agent-logs]
