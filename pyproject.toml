[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
# The PyPI distribution name is `llmai-agent` (the bare `llmai` was already
# taken on PyPI by an unrelated unified-LLM-client project). The import
# package stays `llmai`, so users do:
#     pip install llmai-agent
#     llmai-server     # or: from llmai.agent import AgentLoop
name = "llmai-agent"
version = "0.2.2"
description = "Local AI coding agent — Ollama + any model"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
telemetry = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
memory = [
    "pymongo[srv]>=4.8",
]
elastic = [
    "elasticsearch>=8.13,<9",
]

[project.scripts]
llmai        = "llmai.main:main"
llmai-server = "run_server:main"
llmai-doctor = "llmai.doctor:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llmai*", "server*"]

[tool.setuptools.package-data]
llmai = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Default run excludes integration tests so the suite is offline-friendly.
# Run them explicitly with: pytest tests/integration/ -m integration
addopts = "-m 'not integration' --ignore=tests/integration"
markers = [
    "integration: needs live backends (Ollama / MongoDB / Elasticsearch). Skipped by default.",
]
