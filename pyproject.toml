[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "llmai"
version = "0.2.1"
description = "Local AI coding agent — Ollama + any model"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "requests>=2.34.2",
    "rich>=15.0.0",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.14",
]
telemetry = [
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
]
memory = [
    "pymongo[srv]>=4.17.0",
]
elastic = [
    "elasticsearch>=9.4.1,<10",
]

[project.scripts]
llmai        = "llmai.main:main"
llmai-server = "run_server:main"
llmai-doctor = "llmai.doctor:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llmai*", "server*"]

[tool.setuptools.package-data]
llmai = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Default run excludes integration tests so the suite is offline-friendly.
# Run them explicitly with: pytest tests/integration/ -m integration
addopts = "-m 'not integration' --ignore=tests/integration"
markers = [
    "integration: needs live backends (Ollama / MongoDB / Elasticsearch). Skipped by default.",
]
