[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
# The PyPI distribution name is `llmai-agent` (the bare `llmai` was already
# taken on PyPI by an unrelated unified-LLM-client project). The import
# package stays `llmai`, so users do:
#     pip install llmai-agent
#     llmai-server     # or: from llmai.agent import AgentLoop
name = "llmai-agent"
version = "0.3.0"
description = "Local-first AI coding agent with optional Gemini and Google ADK runtimes"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "requests>=2.34.2",
    "rich>=15.0.0",
    "fastapi>=0.137.1",
    "uvicorn[standard]>=0.49.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.17",
]
telemetry = [
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
]
memory = [
    "pymongo[srv]>=4.17.0",
]
elastic = [
    "elasticsearch>=9.4.1,<10",
]
mcp = [
    "mcp>=1.27.2",
]
google-cloud = [
    "google-adk>=2.2.0",
    "mcp>=1.27.2",
]

[project.scripts]
llmai        = "llmai.main:main"
llmai-server = "server.run:main"
llmai-doctor = "llmai.doctor:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llmai*", "server*", "google_agent*"]

[tool.setuptools.package-data]
llmai = ["py.typed"]
server = ["static/*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    ".bkit",
    ".claude",
    "workspace",
    "docs/archive",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Slide-layout script: long string literals are intentional (ASCII art,
# pre-formatted code blocks). Breaking them would change the rendered output.
"scripts/build_hackathon_deck.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Default run excludes integration tests so the suite is offline-friendly.
# Run them explicitly with: pytest tests/integration/ -m integration
addopts = "-m 'not integration' --ignore=tests/integration"
markers = [
    "integration: needs live backends (Ollama / Gemini / MongoDB / Elasticsearch). Skipped by default.",
]
