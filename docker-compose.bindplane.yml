# Bindplane Agent (OTel collector) → Dynatrace pipeline for vixcode.
#
# Usage:
#   1. Copy .env.example → .env, fill in DT_ENDPOINT + DT_API_TOKEN
#   2. docker compose -f docker-compose.bindplane.yml up -d
#   3. In another terminal:
#        export VIXCODE_OTEL_ENABLED=true
#        export VIXCODE_OTEL_ENDPOINT=http://localhost:4318
#        vixcode-server
#   4. Make a few requests, then check Dynatrace → Traces / Metrics.
#
# The agent (vixcode) speaks plain OTLP/HTTP on :4318. Bindplane is the
# only thing that knows about Dynatrace. Swap the exporter later (e.g.
# Honeycomb, New Relic) without touching agent code.

services:
  bindplane-agent:
    image: ghcr.io/observiq/bindplane-agent:latest
    container_name: vixcode-bindplane
    restart: unless-stopped
    ports:
      - "4318:4318"   # OTLP HTTP
      - "4317:4317"   # OTLP gRPC (optional)
    environment:
      DT_ENDPOINT: ${DT_ENDPOINT:?set DT_ENDPOINT in .env e.g. https://abc12345.live.dynatrace.com}
      DT_API_TOKEN: ${DT_API_TOKEN:?set DT_API_TOKEN in .env (needs ingest scopes)}
    volumes:
      - ./bindplane/config.yaml:/etc/otel/config.yaml:ro
    command: ["--config", "/etc/otel/config.yaml"]
