<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vix Code — Local AI Coding Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root {
            --bg-main: #09090b;
            --bg-sidebar: #121214;
            --surface: #18181b;
            --surface-hover: #27272a;
            --border: #27272a;
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent-start: #3b82f6;
            --accent-end: #8b5cf6;
            --accent-gradient: linear-gradient(135deg, var(--accent-start), var(--accent-end));
            --radius: 12px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: var(--font-sans);
            height: 100vh;
            display: flex;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 16px 12px;
            flex-shrink: 0;
        }

        .burger-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            margin-bottom: 16px;
            transition: background 0.2s;
        }
        .burger-btn:hover {
            background: var(--surface);
            color: var(--text-primary);
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 24px;
        }
        .new-chat-btn:hover {
            background: var(--surface-hover);
            border-color: #3f3f46;
        }

        .sidebar-section {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            padding: 0 8px;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .history-item {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 13px;
            text-align: left;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.2s, color 0.2s;
        }
        .history-item:hover {
            background: var(--surface);
            color: var(--text-primary);
        }

        .sidebar-footer {
            font-size: 11px;
            color: var(--text-muted);
            padding: 16px 8px 8px;
            line-height: 1.5;
            text-align: center;
        }

        /* ── Main Content ── */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: radial-gradient(circle at 50% 0%, rgba(139, 92, 246, 0.05), transparent 50%);
        }

        .top-nav {
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logo span {
            color: var(--text-secondary);
            font-weight: 400;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background 0.2s;
        }
        .status-indicator:hover {
            background: var(--surface-hover);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #facc15;
            box-shadow: 0 0 8px rgba(250, 204, 21, 0.4);
        }
        .status-indicator[data-state="ok"] .status-dot {
            background: #4ade80;
            box-shadow: 0 0 8px rgba(74, 222, 128, 0.4);
        }
        .status-indicator[data-state="bad"] .status-dot {
            background: #f87171;
            box-shadow: 0 0 8px rgba(248, 113, 113, 0.4);
        }

        /* ── Center Area (Welcome & Feed) ── */
        .center-area {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
            scroll-behavior: smooth;
        }
        .center-area::-webkit-scrollbar {
            width: 6px;
        }
        .center-area::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        .welcome-screen {
            max-width: 800px;
            width: 100%;
            margin: auto 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .greeting {
            font-size: 28px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .hero-question {
            font-size: 40px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 48px;
        }

        .chips-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            max-width: 700px;
        }

        .chip {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 12px 18px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .chip:hover {
            background: var(--surface-hover);
            color: var(--text-primary);
            border-color: #52525b;
            transform: translateY(-1px);
        }

        /* ── Chat Feed ── */
        .chat-feed {
            max-width: 800px;
            width: 100%;
            display: none;
            flex-direction: column;
            gap: 24px;
            padding-bottom: 40px;
        }

        .chat-msg {
            display: flex;
            flex-direction: column;
            gap: 6px;
            animation: fadeIn 0.3s ease;
        }

        .chat-user {
            align-items: flex-end;
        }
        .chat-user .chat-bubble {
            background: var(--surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 12px 18px;
            border-radius: 18px 18px 4px 18px;
            max-width: 80%;
            font-size: 15px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .chat-assistant {
            align-items: flex-start;
        }
        .chat-assistant .chat-bubble {
            background: transparent;
            color: var(--text-primary);
            padding: 4px 0;
            border-radius: 0;
            max-width: 100%;
            font-size: 15px;
            line-height: 1.6;
            width: 100%;
        }

        .chat-assistant .chat-bubble p { margin-bottom: 12px; }
        .chat-assistant .chat-bubble p:last-child { margin-bottom: 0; }
        .chat-assistant .chat-bubble pre {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            margin: 12px 0;
            font-family: var(--font-mono);
            font-size: 13px;
        }
        .chat-assistant .chat-bubble code {
            font-family: var(--font-mono);
            background: rgba(255,255,255,0.1);
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 13px;
        }
        .chat-assistant .chat-bubble pre code { background: none; padding: 0; }

        /* ── Input Area ── */
        .input-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 0 24px 24px;
        }

        .input-box {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-box:focus-within {
            border-color: rgba(255,255,255,0.15);
            box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(139, 92, 246, 0.3);
        }

        #chat-text {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 15px;
            resize: none;
            padding: 4px 8px;
            min-height: 44px;
            max-height: 200px;
            outline: none;
            line-height: 1.5;
        }
        #chat-text::placeholder { color: var(--text-muted); }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 4px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .icon-btn:hover {
            background: var(--surface-hover);
            color: var(--text-primary);
        }
        .text-btn {
            width: auto;
            padding: 0 12px;
            font-size: 13px;
            font-weight: 500;
            gap: 6px;
            border: 1px solid transparent;
        }
        .text-btn:hover {
            border-color: var(--border);
        }

        .spacer { flex: 1; }

        .send-btn {
            background: var(--text-primary);
            color: var(--bg-main);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .send-btn:hover:not(:disabled) {
            transform: scale(1.05);
            background: var(--accent-start);
            color: white;
        }
        .send-btn:disabled {
            background: var(--surface-hover);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .footer-links {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 16px;
        }
        .cli-link {
            display: inline-block;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            text-decoration: none;
            padding: 4px 8px;
            border-radius: 6px;
            margin-left: 6px;
            transition: all 0.2s;
        }
        .cli-link:hover {
            background: var(--surface-hover);
            color: var(--text-primary);
        }
        
        .brand-footer {
            margin-top: 8px;
            font-size: 11px;
            opacity: 0.5;
        }

    </style>
</head>
<body>

            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>

            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            New chat
        </button>
        
        <div class="sidebar-section">Recent</div>
        <div class="history-list">
            <button class="history-item">Evaluate this app and su...</button>

            <button class="history-item">Build US stock market al...</button>
        </div>

        <div class="sidebar-footer">

            <div class="welcome-screen" id="welcome-screen">
                <h2 class="greeting">Hi sechan9999</h2>

                <div class="chips-grid">
                    <button class="chip" onclick="useChip(this)"><span style="color:#3b82f6">🌐</span> Build a landing page</button>
                    <button class="chip" onclick="useChip(this)"><span style="color:#10b981">💡</span> Find AI tools</button>
                    <button class="chip" onclick="useChip(this)"><span style="color:#a855f7">📄</span> Project proposal</button>
                    <button class="chip" onclick="useChip(this)"><span style="color:#06b6d4">🔍</span> Search latest news</button>

                    <button class="chip" onclick="useChip(this)"><span style="color:#f59e0b">📈</span> Build a dashboard</button>
                    <button class="chip" onclick="useChip(this)"><span style="color:#8b5cf6">🎬</span> Create a slide deck</button>

                    </button>
                    <button class="icon-btn text-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.121 2.121 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                        Tools
                    </button>
                    <div class="spacer"></div>
                    <button id="chat-send" class="send-btn" onclick="sendChat()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                    </button>
                </div>
            </div>
            <div class="footer-links">
                Run it in the terminal <a href="https://github.com/sechan9999/LLMai" target="_blank" class="cli-link">Vix Code CLI ↗</a>
                <div class="brand-footer">vibeindex.ai</div>
            </div>
        </div>
    </main>

    <script>
    // ── In-page chat against the user's local Ollama ───────────────────────
    const OLLAMA = 'http://localhost:11434';
    const PREFERRED = ['qwen2.5-coder', 'qwen2.5', 'llama3.1', 'llama3.2', 'gemma3', 'phi3', 'mistral'];

    let activeModel = null;
    let chatBusy = false;
    const SYSTEM = "You are a helpful coding assistant. Be concise. Use Markdown and fenced code blocks for code.";
    const history = [{ role: 'system', content: SYSTEM }];

    const $status = () => document.getElementById('chat-status');
    const $model  = () => document.getElementById('chat-model');
    const $feed   = () => document.getElementById('chat-feed');
    const $welcome= () => document.getElementById('welcome-screen');
    const $text   = () => document.getElementById('chat-text');
    const $send   = () => document.getElementById('chat-send');
    const $center = () => document.getElementById('center-area');

    function setStatus(state, text) {
        const el = $status();
        el.dataset.state = state;
        $model().textContent = text;
    }

    async function detectOllama() {
        setStatus('loading', 'Looking for Ollama...');
        try {
            const r = await fetch(`${OLLAMA}/api/tags`, { method: 'GET' });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const data = await r.json();
            const models = (data.models || []).map(m => m.name);
            if (!models.length) {
                setStatus('bad', 'Ollama has no models (click)');
                return;
            }
            activeModel = models.find(m => PREFERRED.some(p => m.startsWith(p))) || models[0];
            setStatus('ok', activeModel);
            $send().disabled = false;
        } catch (e) {
            setStatus('bad', "Can't reach Ollama (click)");
        }
    }

    function showSetupHelp() {
        if (document.getElementById('chat-help-msg')) return;
        $welcome().style.display = 'none';
        $feed().style.display = 'flex';
        
        const helpText = `__No local Ollama detected.__\n\nTo enable browser chat from this page:\n\n1) **Install Ollama**\nmacOS: \`brew install ollama\`\nWindows/Linux: Download from [ollama.com](https://ollama.com)\n\n2) **Pull a model**\n\`\`\`bash\nollama pull qwen2.5-coder\n\`\`\`\n\n3) **Start the server with this origin allowed**\n\n**macOS/Linux:**\n\`\`\`bash\nOLLAMA_ORIGINS=${location.origin} ollama serve\n\`\`\`\n\n**Windows (PowerShell):**\n\`\`\`powershell\n$env:OLLAMA_ORIGINS="${location.origin}"\nollama serve\n\`\`\`\n\n*(Note: Quit the Ollama app from your system tray/taskbar first if it is already running)*\n\nThen reload this page.`;
        
        appendMsg('assistant', helpText, 'chat-help-msg');
    }

    function useChip(btn) {
        // Extract text content ignoring the emoji span
        const clone = btn.cloneNode(true);
        const span = clone.querySelector('span');
        if (span) span.remove();
        const text = clone.textContent.trim();
        
        $text().value = text;
        $text().focus();
        sendChat();
    }

    function appendMsg(role, content, id) {
        $welcome().style.display = 'none';
        $feed().style.display = 'flex';

        const row = document.createElement('div');
        row.className = `chat-msg chat-${role}`;
        if (id) row.id = id;
        
        const bubble = document.createElement('div');
        bubble.className = 'chat-bubble';
        bubble.dataset.raw = content || '';
        renderInto(bubble, content || '');
        
        row.appendChild(bubble);
        $feed().appendChild(row);
        scrollToBottom();
        return bubble;
    }

    function renderInto(el, raw) {
        if (window.marked) {
            el.innerHTML = marked.parse(raw);
            if (window.hljs) el.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
        } else {
            el.textContent = raw;
        }
    }

    function appendDelta(bubble, delta) {
        bubble.dataset.raw += delta;
        renderInto(bubble, bubble.dataset.raw);
        scrollToBottom();
    }
    
    function scrollToBottom() {
        $center().scrollTop = $center().scrollHeight;
    }

    async function sendChat() {
        const txt = $text().value.trim();
        if (!txt || chatBusy) return;

        chatBusy = true;
        $send().disabled = true;
        $text().value = '';
        $text().style.height = 'auto';

        appendMsg('user', txt);
        history.push({ role: 'user', content: txt });

        if (!activeModel) {
            await detectOllama();
            if (!activeModel) {
                const existingHelp = document.getElementById('chat-help-msg');
                if (existingHelp) existingHelp.remove();
                showSetupHelp();
                chatBusy = false;
                $send().disabled = false;
                $text().focus();
                return;
            }
        }

        const reply = appendMsg('assistant', '');

        try {
            const resp = await fetch(`${OLLAMA}/v1/chat/completions`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: activeModel,
                    messages: history,
                    stream: true,
                }),
            });
            if (!resp.ok) throw new Error('HTTP ' + resp.status);

            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let buf = '';
            let full = '';
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buf += decoder.decode(value, { stream: true });
                let idx;
                while ((idx = buf.indexOf('\n')) >= 0) {
                    const line = buf.slice(0, idx).trim();
                    buf = buf.slice(idx + 1);
                    if (!line || line === 'data: [DONE]') continue;
                    if (!line.startsWith('data: ')) continue;
                    try {
                        const obj = JSON.parse(line.slice(6));
                        const piece = obj.choices?.[0]?.delta?.content || '';
                        if (piece) { full += piece; appendDelta(reply, piece); }
                    } catch { /* ignore partial */ }
                }
            }
            history.push({ role: 'assistant', content: full });
        } catch (e) {
            reply.dataset.raw = `__Request failed:__ ${e.message}\n\nIf this is a CORS error, quit Ollama from your taskbar/menu and restart it from the terminal:\n\n**macOS/Linux:**\n\`\`\`bash\nOLLAMA_ORIGINS=${location.origin} ollama serve\n\`\`\`\n\n**Windows (PowerShell):**\n\`\`\`powershell\n$env:OLLAMA_ORIGINS="${location.origin}"\nollama serve\n\`\`\``;
            renderInto(reply, reply.dataset.raw);
        } finally {
            chatBusy = false;
            $send().disabled = false;
            $text().focus();
            scrollToBottom();
        }
    }

    // Auto-grow textarea + Enter-to-send
    document.addEventListener('DOMContentLoaded', () => {
        const ta = $text();
        ta.addEventListener('input', () => {
            ta.style.height = 'auto';
            ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
        });
        ta.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { 
                e.preventDefault(); 
                sendChat(); 
            }
        });
        if (window.marked) {
            marked.setOptions({ breaks: true, gfm: true });
        }
        detectOllama();
    });
    </script>
</body>
</html>
